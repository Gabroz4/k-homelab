apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: host-log-collector
  namespace: kyverno
spec:
  evaluationMode: Kyverno
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-non-root
    - kind: ValidatingPolicy
      name: require-no-privilege-escalation
    - kind: ValidatingPolicy
      name: require-drop-all-capabilities
    - kind: ValidatingPolicy
      name: require-seccomp-profile
  reportResult: skip
  matchConditions:
    - name: alloy-reads-root-only-var-log-pods
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        (object.metadata.name == 'alloy' || object.metadata.name.startsWith('alloy-'))
