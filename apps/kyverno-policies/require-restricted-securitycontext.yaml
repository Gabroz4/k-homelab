apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-restricted-securitycontext
spec:
  failurePolicy: Ignore
  validationActions:
    - Audit
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - flux-system
            - kyverno
            - longhorn-system
            - metallb-system
            - system-upgrade
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) &&
        object.spec.securityContext.runAsNonRoot == true) ||
        object.spec.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
      message: >-
        runAsNonRoot must be true, set on the pod securityContext or on every container.
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false))
      message: >-
        allowPrivilegeEscalation must be false on every container and initContainer.
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&
        'ALL' in c.securityContext.capabilities.drop) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop))
      message: >-
        capabilities.drop must include ALL on every container and initContainer.
    - expression: >-
        (has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost']) ||
        object.spec.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.seccompProfile) &&
        c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'])
      message: >-
        seccompProfile.type must be RuntimeDefault or Localhost.
