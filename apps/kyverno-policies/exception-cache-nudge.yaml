apiVersion: v1
kind: ServiceAccount
metadata:
  name: exception-cache-nudge
  namespace: kyverno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exception-cache-nudge
  namespace: kyverno
rules:
  - apiGroups: ["policies.kyverno.io"]
    resources: ["policyexceptions"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exception-cache-nudge
  namespace: kyverno
subjects:
  - kind: ServiceAccount
    name: exception-cache-nudge
    namespace: kyverno
roleRef:
  kind: Role
  name: exception-cache-nudge
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: exception-cache-nudge
  namespace: kyverno
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: exception-cache-nudge
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nudge
              image: alpine/k8s:1.37.0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  kubectl -n kyverno annotate policyexceptions.policies.kyverno.io \
                    root-init-workloads cache-nudge="$(date +%s)" --overwrite
