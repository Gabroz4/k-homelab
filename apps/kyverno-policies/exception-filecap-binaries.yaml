apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: filecap-binaries
  namespace: kyverno
spec:
  evaluationMode: Kyverno
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-non-root
  reportResult: skip
  matchConditions:
    - name: adguard-binary-carries-file-capabilities
      expression: >-
        object.metadata.namespace == 'adguard' &&
        (object.metadata.name == 'adguardhome' || object.metadata.name.startsWith('adguardhome-'))
