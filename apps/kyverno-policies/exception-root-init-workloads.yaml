apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: root-init-workloads
  namespace: kyverno
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: require-restricted-securitycontext
  reportResult: skip
  matchConditions:
    - name: s6-and-entrypoint-root-init
      expression: >-
        (object.metadata.namespace == 'jellyfin' &&
        ['sonarr', 'radarr', 'prowlarr', 'qbittorrent', 'dispatcharr', 'tvheadend'].exists(n,
        object.metadata.name == n || object.metadata.name.startsWith(n + '-'))) ||
        (object.metadata.namespace == 'music' && (object.metadata.name == 'lidarr' ||
        object.metadata.name.startsWith('lidarr-'))) ||
        (object.metadata.namespace == 'nextcloud' &&
        !object.metadata.name.startsWith('nextcloud-db-backup') &&
        (object.metadata.name == 'nextcloud' || object.metadata.name.startsWith('nextcloud-')))
