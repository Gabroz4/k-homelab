apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: root-init-workloads
  namespace: kyverno
spec:
  evaluationMode: Kyverno
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-non-root
    - kind: ValidatingPolicy
      name: require-drop-all-capabilities
  reportResult: skip
  matchConditions:
    - name: s6-and-entrypoint-root-init
      expression: >-
        (object.metadata.namespace == 'jellyfin' &&
        ['sonarr', 'radarr', 'prowlarr', 'qbittorrent', 'dispatcharr'].exists(n,
        object.metadata.name == n || object.metadata.name.startsWith(n + '-'))) ||
        (object.metadata.namespace == 'music' && (object.metadata.name == 'lidarr' ||
        object.metadata.name.startsWith('lidarr-')))
