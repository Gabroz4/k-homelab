apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-prune
  namespace: backup
spec:
  schedule: "25 4 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 39600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: restic-prune
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: ${PRIMARY_NODE}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              image: restic/restic:0.19.1
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 3Gi
              volumeMounts:
                - name: data
                  mountPath: /data
              command:
                - /bin/sh
                - -c
                - |
                  set -uo pipefail
                  failed=""

                  prune_repo() {
                    local repo_name="$1"
                    export RESTIC_PASSWORD="$2"
                    local url="/data/$repo_name"
                    if [ ! -f "$url/config" ]; then
                      echo "== skip: $repo_name (repository not initialised yet) =="
                      return 0
                    fi
                    echo "== unlock: $repo_name =="
                    restic -r "$url" unlock || return 1
                    echo "== forget+prune: $repo_name =="
                    restic -r "$url" forget --keep-daily 7 --keep-weekly 4 --keep-monthly 12 --prune || return 1
                    echo "== check: $repo_name =="
                    restic -r "$url" check --read-data-subset=2% || return 1
                  }

                  prune_repo immich-files     "$IMMICH_FILES_PASSWORD"     || failed="$failed immich-files"
                  prune_repo immich-db        "$IMMICH_DB_PASSWORD"        || failed="$failed immich-db"
                  prune_repo nextcloud-db     "$NEXTCLOUD_DB_PASSWORD"     || failed="$failed nextcloud-db"
                  prune_repo nextcloud-minio  "$NEXTCLOUD_MINIO_PASSWORD"  || failed="$failed nextcloud-minio"
                  prune_repo authentik-db     "$AUTHENTIK_DB_PASSWORD"     || failed="$failed authentik-db"
                  prune_repo matrix-db        "$MATRIX_DB_PASSWORD"        || failed="$failed matrix-db"
                  prune_repo matrix-files     "$MATRIX_FILES_PASSWORD"     || failed="$failed matrix-files"
                  prune_repo pankha-db        "$PANKHA_DB_PASSWORD"        || failed="$failed pankha-db"
                  prune_repo jellyfin-config  "$JELLYFIN_CONFIG_PASSWORD"  || failed="$failed jellyfin-config"
                  prune_repo adguard          "$ADGUARD_PASSWORD"          || failed="$failed adguard"

                  if [ -n "$failed" ]; then
                    echo "== FAILED repos:$failed =="
                    exit 1
                  fi
                  echo "== all repos pruned and checked =="
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache
                - name: IMMICH_FILES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: immich-files-password
                - name: IMMICH_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: immich-db-password
                - name: NEXTCLOUD_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: nextcloud-db-password
                - name: NEXTCLOUD_MINIO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: nextcloud-minio-password
                - name: AUTHENTIK_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: authentik-db-password
                - name: MATRIX_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: matrix-db-password
                - name: MATRIX_FILES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: matrix-files-password
                - name: PANKHA_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: pankha-db-password
                - name: JELLYFIN_CONFIG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: jellyfin-config-password
                - name: ADGUARD_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-admin-creds
                      key: adguard-password
          volumes:
            - name: data
              hostPath:
                path: ${BACKUP_PATH}/restic
                type: Directory
