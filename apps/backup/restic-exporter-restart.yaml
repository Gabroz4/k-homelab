apiVersion: v1
kind: ServiceAccount
metadata:
  name: restic-exporter-restart
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restic-exporter-restart
  namespace: backup
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restic-exporter-restart
  namespace: backup
subjects:
  - kind: ServiceAccount
    name: restic-exporter-restart
    namespace: kube-system
roleRef:
  kind: Role
  name: restic-exporter-restart
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-exporter-restart
  namespace: kube-system
spec:
  schedule: "5 5 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: restic-exporter-restart
        spec:
          restartPolicy: OnFailure
          serviceAccountName: restic-exporter-restart
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              image: alpine/k8s:1.37.1
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  kubectl -n backup rollout restart deployment -l app=restic-exporter
