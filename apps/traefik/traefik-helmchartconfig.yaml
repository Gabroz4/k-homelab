apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        loadBalancerIP: 192.168.0.55
    ports:
      web:
        transport:
          respondingTimeouts:
            readTimeout: 30m
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 30m
