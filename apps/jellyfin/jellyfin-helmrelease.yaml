apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 1h
  releaseName: jellyfin
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    image:
      repository: jellyfin/jellyfin
      tag: "10.11.11"
      pullPolicy: IfNotPresent

    replicaCount: 1
    deploymentStrategy:
      type: Recreate

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    jellyfin:
      env:
        - name: TZ
          value: ${TIMEZONE}

    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 8096

    ingress:
      main:
        enabled: false

    persistence:
      config:
        enabled: true
        type: pvc
        storageClass: "local-path"
        accessMode: ReadWriteOnce
        size: 10Gi

      media:
        enabled: true
        type: hostPath
        hostPath: ${MEDIA_PATH}
        mountPath: /media

      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi

    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "6"
        memory: "2Gi"

    startupProbe:
      tcpSocket: null
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 60
